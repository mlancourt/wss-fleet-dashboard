<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#B71C1C">
<title>WSS Fleet Tracker</title>
<!-- Relative paths only: this must work at the domain root AND at
     mlancourt.github.io/<repo>/ while we test pre-DNS. -->
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet Tracker">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="hdr-row">
      <a class="brand" href="#/" aria-label="WSS Fleet Tracker home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
            <path d="M5 6h14M5 12h10M5 18h6"/>
          </svg>
        </span>
        <span class="brand-name">WSS Fleet Tracker<span class="brand-ver">v1.0</span></span>
      </a>
      <button class="refresh" id="refresh" type="button" title="Reload data" aria-label="Reload data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>
        </svg>
      </button>
    </div>
    <div class="hdr-meta" id="hdr-meta">
      <span id="asof" class="asof">loading&hellip;</span>
      <span id="pending-badge" class="pending-badge" hidden></span>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1">
  <div class="loading">Loading&hellip;</div>
</main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#/" data-tab="fleet" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/>
    </svg>Fleet</a>
  <a href="#/rentals" data-tab="rentals" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h10"/>
    </svg>Rentals</a>
  <a href="#/holds" data-tab="holds" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
    </svg>Holds</a>
  <a href="#/dispatch" data-tab="dispatch" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 7.5h11v9H2zM13 10.5h4.2l2.8 3v3h-7z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/>
    </svg>Dispatch<span id="tab-dispatch-badge" class="tab-badge" hidden></span></a>
  <a href="#/service" data-tab="service" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.5 4.5a4 4 0 0 0-4.9 5L4 15.1a1.8 1.8 0 0 0 0 2.5l2.4 2.4a1.8 1.8 0 0 0 2.5 0l5.6-5.6a4 4 0 0 0 5-4.9l-2.6 2.6-2.8-.7-.7-2.8Z"/>
    </svg>Service</a>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
